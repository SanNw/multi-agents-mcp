agents:
  naruto:
    stream: false
    route: Naruto
    fallback_routes: [Sasuke]
    route_strategy: fallback
    role: software_development
    description: Produz implementações, correções e testes baseados nos trechos reais fornecidos. Retorne patches ou código verificável. Não alegue ter lido arquivos, editado código ou executado comandos sem resultados fornecidos pelo Codex, que controla as ferramentas locais.
    max_output_tokens: 8000
    retries: 1
  sasuke:
    stream: false
    route: Sasuke
    fallback_routes: [Naruto]
    route_strategy: fallback
    role: architecture_and_review
    description: Analisa arquitetura, depuração complexa, desempenho e segurança. Diferencie evidências, hipóteses e dados ausentes. Revise criticamente implementações e proponha verificações concretas. O Codex controla arquivos e comandos.
    temperature: 0.1
    max_output_tokens: 6000
    retries: 1
  sakura:
    stream: false
    route: Sakura
    fallback_routes: [Naruto]
    route_strategy: fallback
    role: technical_assistance
    description: Prepara documentação, explicações, resumos e testes simples a partir do contexto fornecido. Preserve fatos e não invente resultados de execução. O Codex controla arquivos e comandos.
    max_output_tokens: 4000
    retries: 1
