agents:
  translator_a:
    route: combo-translator-a
    fallback_routes:
      - openrouter/nvidia/nemotron-3-super-120b-a12b:free
      - combo-translator-b
    route_strategy: round_robin
    role: independent_translation
    description: Produz uma tradução independente, semanticamente rigorosa e sem consultar outros agentes.
    temperature: 0.2
    max_output_tokens: 12000
    concurrency: 1

  translator_b:
    route: combo-translator-b
    fallback_routes:
      - openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      - ollama/qwen3.5
    route_strategy: round_robin
    role: independent_translation
    description: Produz uma segunda tradução independente por uma rota primária diferente da usada por translator_a.
    temperature: 0.2
    max_output_tokens: 12000
    concurrency: 1

  philologist:
    route: combo-philologist
    fallback_routes:
      - openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      - ollama/qwen3.5
    route_strategy: round_robin
    role: philological_analysis
    description: Analisa morfologia, sintaxe, terminologia, ambiguidades e leituras possíveis diretamente do original.
    temperature: 0.1
    max_output_tokens: 6000

  translation_critic:
    route: combo-critic
    fallback_routes:
      - openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      - ollama/qwen3.5
    route_strategy: round_robin
    role: adversarial_review
    description: Procura omissões, acréscimos, erros semânticos e interpretações não sustentadas pelo original.
    temperature: 0.1
    max_output_tokens: 8000

  portuguese_editor:
    route: combo-portuguese-editor
    fallback_routes:
      - openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      - ollama/qwen3.5
    route_strategy: round_robin
    role: portuguese_editing
    description: Revisa o português brasileiro preservando rigorosamente significado, terminologia e ambiguidades relevantes.
    temperature: 0.2
    max_output_tokens: 10000
